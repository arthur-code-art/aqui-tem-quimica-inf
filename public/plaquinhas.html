<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>38 Plaquinhas do Campus — AQUI TEM QUÍMICA!</title>
  <meta name="theme-color" content="#0b0614">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23150c26'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='38'%3E%E2%9A%97%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/identidade-neon.css?v=6">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1260px; margin: 20px auto 0; padding: 0 16px 136px; }

    .pl-hero {
      padding: 22px; border-radius: 18px; margin-bottom: 16px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
    }
    .pl-kicker { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: var(--dourado-claro); margin-bottom: 4px; }
    [data-tema="claro"] .pl-kicker { color: #8a6208; }
    .pl-hero h1 { margin: 0 0 4px; font-size: clamp(24px, 3.6vw, 34px); }
    .pl-hero p { margin: 0; font-size: 13.5px; opacity: 0.86; }
    .pl-hero-right { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .pl-prog-box {
      min-width: 210px; padding: 10px 14px; border-radius: 14px;
      border: 1px solid var(--borda); background: rgba(255,255,255,0.05);
    }
    [data-tema="claro"] .pl-prog-box { background: #faf3e3; }
    .pl-prog-track { height: 7px; border-radius: 999px; background: rgba(148,163,184,0.24); overflow: hidden; margin-top: 6px; }
    #pl-prog-fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #6d4aa3, #c084fc, #f5d37a); transition: width 0.5s ease; }
    [data-tema="claro"] #pl-prog-fill { background: linear-gradient(90deg, #9a6d08, #c89b3c, #e7c873); }

    .pl-filtros { padding: 16px; border-radius: 18px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
    .pl-filtros-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .pl-chips-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .pl-chip-classe, .pl-visao-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
      cursor: pointer; border: 1px solid var(--borda); background: rgba(255,255,255,0.06); color: var(--texto);
    }
    .pl-c-num { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: rgba(255,255,255,0.16); }
    .pl-controls-grid { display: grid; grid-template-columns: 2fr repeat(4, 1fr); gap: 8px; }
    .pl-controls-grid input, .pl-controls-grid select {
      width: 100%; padding: 9px 12px; border-radius: 10px; font-size: 13px;
      background: rgba(15,8,28,0.82); color: #f7f3ff; border: 1px solid rgba(200,162,77,0.42);
    }
    .pl-subbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; }

    .pl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
    .pl-card {
      position: relative; padding: 16px; border-radius: 16px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
      animation: plCardIn 0.36s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes plCardIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .pl-card-accent { position: absolute; top: 0; left: 0; right: 0; height: 3px; opacity: 0.9; }
    .pl-card-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .pl-code-pill {
      font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800;
      padding: 3px 8px; border-radius: 8px; background: rgba(200,155,60,0.16); border: 1px solid var(--borda);
    }
    .pl-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; border: 1px solid;
    }
    .pl-stamp-ok {
      margin-left: auto; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px;
      background: rgba(22,163,74,0.18); color: #22c55e; border: 1px solid rgba(34,197,94,0.5);
    }
    .pl-stamp-pend {
      font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
      background: rgba(148,163,184,0.16); border: 1px solid rgba(148,163,184,0.35);
    }
    .pl-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .pl-card-title { margin: 0; font-size: 18px; line-height: 1.2; overflow-wrap: anywhere; }
    .pl-formula-chip {
      flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 800;
      padding: 4px 9px; border-radius: 9px; color: var(--dourado-claro);
      background: rgba(200,155,60,0.14); border: 1px solid var(--borda);
    }
    [data-tema="claro"] .pl-formula-chip { color: #8a6208; background: #faf3e3; }
    .pl-loc-box { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
    .pl-zone-tag { font-size: 12px; font-weight: 700; }
    .pl-meta-mini { font-size: 11px; opacity: 0.78; font-family: 'JetBrains Mono', monospace; }
    .pl-exact { font-size: 12px; opacity: 0.85; margin-bottom: 8px; }
    .pl-desc { margin: 0; font-size: 12.5px; line-height: 1.48; opacity: 0.88; }
    .pl-card-foot { display: flex; gap: 7px; padding-top: 10px; border-top: 1px solid rgba(200,162,77,0.22); }
    .pl-card-foot .btn {
      padding: 7px 10px; font-size: 12px; font-weight: 700; border-radius: 9px;
      text-decoration: none; text-align: center; cursor: pointer;
      background: rgba(255,255,255,0.08); color: var(--texto); border: 1px solid var(--borda);
    }
    .pl-btn-go { flex: 1; }

    /* Visao por Zona */
    .pl-zone-group { margin-bottom: 24px; }
    .pl-zone-header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
      margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--borda);
    }
    .pl-zone-header h2 { margin: 0; font-size: 21px; }
    .pl-zone-header small { font-size: 12px; opacity: 0.8; }

    /* Visao Lista Compacta */
    .pl-list-wrap { display: flex; flex-direction: column; gap: 9px; }
    .pl-row-item {
      padding: 12px 14px; border-radius: 14px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    }
    .pl-row-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; flex: 1; }
    .pl-row-right { display: flex; gap: 6px; flex-shrink: 0; }
    .pl-row-right .btn { padding: 6px 10px; font-size: 12px; border-radius: 9px; text-decoration: none; cursor: pointer; background: rgba(255,255,255,0.08); color: var(--texto); border: 1px solid var(--borda); }
    .pl-mono-inline { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: #c89b3c; }

    .pl-empty { padding: 36px 20px; text-align: center; border-radius: 18px; }

    /* Modal de Previa Rapida */
    .pl-modal-bg {
      position: fixed; inset: 0; z-index: 10025; background: rgba(8,4,16,0.82);
      backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 14px;
    }
    .pl-modal-box {
      background: linear-gradient(160deg, #130924, #1e1036); color: #f7f3ff;
      width: min(600px, 100%); max-height: 90vh; overflow-y: auto;
      border-radius: 20px; border: 1.5px solid #f5d37a; padding: 20px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.62), 0 0 32px rgba(168,85,247,0.34);
      animation: plCardIn 0.25s ease;
    }
    [data-tema="claro"] .pl-modal-box {
      background: linear-gradient(160deg, #ffffff, #faf3e3); color: #1f1a14;
      border-color: #c89b3c; box-shadow: 0 20px 50px rgba(138,98,8,0.22);
    }
    .pl-modal-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .pl-modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 10px 0 12px; flex-wrap: wrap; }
    .pl-modal-formula {
      font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 800;
      padding: 8px 14px; border-radius: 12px; border: 1.5px solid #c89b3c;
      background: rgba(200,155,60,0.14); color: #f5d37a;
    }
    [data-tema="claro"] .pl-modal-formula { color: #8a6208; background: #ffffff; }
    .pl-modal-photo { width: 100%; max-height: 210px; border-radius: 12px; overflow: hidden; margin-bottom: 12px; border: 1px solid var(--borda); }
    .pl-modal-photo img { width: 100%; height: 210px; object-fit: cover; display: block; }
    .pl-ph-wrap { margin-bottom: 12px; }
    .pl-ph-bar { position: relative; height: 11px; border-radius: 999px; background: linear-gradient(90deg,#ef4444,#f97316,#eab308,#22c55e,#06b6d4,#3b82f6,#8b5cf6); }
    .pl-ph-dot { position: absolute; top: 50%; width: 17px; height: 17px; border-radius: 50%; background: #fff; border: 3px solid #140b24; transform: translate(-50%,-50%); }
    .pl-modal-sec { margin-bottom: 10px; font-size: 13.5px; line-height: 1.5; }
    .pl-modal-sec p { margin: 3px 0 0; opacity: 0.9; }
    .pl-modal-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(200,162,77,0.28); }
    .pl-modal-actions .btn { padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; }

    @media (max-width: 960px) { .pl-controls-grid { grid-template-columns: repeat(2, 1fr); } #pl-busca { grid-column: 1 / -1; } }
    @media (max-width: 560px) {
      main { padding: 0 12px 144px; }
      .pl-hero { padding: 16px; }
      .pl-controls-grid { grid-template-columns: 1fr; }
      .pl-grid { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="/css/mobile-app.css?v=4">
  <meta name="robots" content="noai, noimageai">
  <script src="/js/escudo-anti-copia.js?v=1"></script>
</head>
<body>
  <main>
    <section class="pl-hero card atq-visivel">
      <div>
        <div class="pl-kicker">ACERVO INTERATIVO · CEFET-MG CAMPUS V</div>
        <h1>🧪 Todas as <span id="pl-stat-total">38</span> Plaquinhas</h1>
        <p>Filtre por classe química, zona do campus, grupo ou progresso do Passaporte e abra a prévia ou o GPS.</p>
      </div>
      <div class="pl-hero-right">
        <div class="pl-prog-box">
          <div style="display:flex;justify-content:space-between;font-size:12px;">
            <span>Seu Passaporte</span>
            <strong id="pl-stat-vis" style="color:#c89b3c;">0/38 (0%)</strong>
          </div>
          <div class="pl-prog-track"><div id="pl-prog-fill"></div></div>
        </div>
        <button type="button" id="pl-btn-random" class="btn btn-primary" style="padding:10px 15px;border-radius:12px;font-weight:800;cursor:pointer;">🎲 Surpreenda-me</button>
      </div>
    </section>

    <section class="pl-filtros card atq-visivel">
      <div class="pl-filtros-top">
        <div class="pl-chips-row">
          <button type="button" class="pl-chip-classe btn ativo" data-classe="Todas">Todas <span class="pl-c-num">38</span></button>
          <button type="button" class="pl-chip-classe btn" data-classe="Ácido">🔴 Ácidos <span class="pl-c-num">0</span></button>
          <button type="button" class="pl-chip-classe btn" data-classe="Base">🔵 Bases <span class="pl-c-num">0</span></button>
          <button type="button" class="pl-chip-classe btn" data-classe="Sal">🟢 Sais <span class="pl-c-num">0</span></button>
          <button type="button" class="pl-chip-classe btn" data-classe="Óxido">🟠 Óxidos <span class="pl-c-num">0</span></button>
        </div>
        <div class="pl-chips-row">
          <button type="button" class="pl-visao-btn btn ativo" data-visao="grade">⊞ Grade</button>
          <button type="button" class="pl-visao-btn btn" data-visao="zonas">📍 Por Zona</button>
          <button type="button" class="pl-visao-btn btn" data-visao="lista">☰ Lista</button>
        </div>
      </div>

      <div class="pl-controls-grid">
        <input type="search" id="pl-busca" placeholder="Buscar código (INF-G01-P1), substância, fórmula ou local...">
        <select id="pl-zona" aria-label="Filtrar por zona"><option value="Todas">Todas as zonas</option></select>
        <select id="pl-grupo" aria-label="Filtrar por grupo"><option value="Todos">Todos os grupos</option></select>
        <select id="pl-status" aria-label="Filtrar por Passaporte">
          <option value="todas">Passaporte: Todas</option>
          <option value="visitadas">✅ Já escaneadas</option>
          <option value="pendentes">🔒 Ainda faltam</option>
        </select>
        <select id="pl-ordem" aria-label="Ordenar plaquinhas">
          <option value="codigo">Ordenar: Código</option>
          <option value="zona">Ordenar: Zona</option>
          <option value="nome">Ordenar: Nome A–Z</option>
          <option value="ph-asc">Ordenar: Menor pH</option>
          <option value="ph-desc">Ordenar: Maior pH</option>
        </select>
      </div>

      <div class="pl-subbar">
        <strong id="pl-contador">Carregando plaquinhas...</strong>
        <button type="button" id="pl-btn-limpar" class="btn" style="display:none;padding:5px 11px;font-size:12px;">✕ Limpar filtros</button>
      </div>
    </section>

    <div id="pl-container">
      <div class="card pl-empty">Carregando acervo das 38 plaquinhas...</div>
    </div>
  </main>

  <script src="/js/plaquinhas-page.js?v=1" defer></script>
  <script src="/js/navbar-global.js?v=3" defer></script>
  <script src="/js/efeitos-editorial.js?v=7" defer></script>
  <script src="/js/progresso.js?v=6" defer></script>
  <script src="/js/scanner-qr.js?v=3" defer></script>
  <script src="/js/quimicobot-ia.js?v=5" defer></script>
  <script src="/js/mobile-app.js?v=4" defer></script>
</body>
</html>
