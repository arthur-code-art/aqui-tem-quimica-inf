<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha da Plaquinha — AQUI TEM QUÍMICA!</title>
  <meta name="theme-color" content="#0b0614">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23150c26'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='38'%3E%E2%9A%97%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/identidade-neon.css?v=6">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    main#sub-pro-root {
      max-width: 980px;
      margin: 18px auto 0;
      padding: 0 14px 136px;
      width: 100%;
    }
    .sub-breadcrumb {
      display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
      font-size: 12px; opacity: 0.82; margin-bottom: 12px;
    }
    .sub-breadcrumb a { text-decoration: none; font-weight: 700; color: inherit; }
    .sub-card {
      background: var(--bg-card);
      color: var(--texto);
      border: 1px solid var(--borda);
      border-radius: 18px;
      box-shadow: var(--sombra);
      backdrop-filter: blur(10px);
    }
    .sub-hero { padding: 20px; }
    .sub-hero-top {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px;
    }
    .sub-badge, .sub-code-pill, .sub-ph-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 11px; border-radius: 999px; font-size: 11px; font-weight: 800;
      border: 1px solid var(--borda); letter-spacing: 0.04em;
    }
    .sub-code-pill { font-family: 'JetBrains Mono', monospace; background: rgba(200,155,60,0.14); }
    .sub-hero-main {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
    }
    .sub-hero-text { min-width: 0; flex: 1; }
    .sub-title {
      margin: 0 0 6px; font-size: clamp(24px, 4.4vw, 36px); line-height: 1.12;
      overflow-wrap: anywhere;
    }
    .sub-pop { margin: 0 0 6px; font-size: 13px; opacity: 0.84; }
    .sub-loc-line { margin: 0; font-size: 13.5px; line-height: 1.4; }
    .sub-formula-box {
      flex-shrink: 0; min-width: 138px; padding: 14px 18px; border-radius: 16px; text-align: center;
      background: linear-gradient(145deg, rgba(124,77,255,0.22), rgba(200,162,77,0.14));
      border: 1.5px solid var(--dourado);
      box-shadow: 0 0 22px rgba(192,132,252,0.24);
    }
    [data-tema="claro"] .sub-formula-box {
      background: linear-gradient(145deg, #ffffff, #faf0d7);
      border-color: #c89b3c;
      box-shadow: 0 8px 20px rgba(184,134,11,0.14);
    }
    .sub-formula-lbl { display: block; font-size: 10px; font-weight: 800; letter-spacing: 0.1em; color: var(--dourado-claro); margin-bottom: 4px; }
    [data-tema="claro"] .sub-formula-lbl { color: #8a6208; }
    .sub-formula-val { font-family: 'JetBrains Mono', monospace; font-size: clamp(20px, 3vw, 28px); font-weight: 800; }
    .sub-actions {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding-top: 14px;
      border-top: 1px solid rgba(200,162,77,0.24);
    }
    .sub-actions .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 14px; border-radius: 11px; font-size: 13px; font-weight: 700;
      text-decoration: none; cursor: pointer; min-height: 40px;
      background: rgba(255,255,255,0.08); color: var(--texto); border: 1px solid var(--borda);
    }

    /* Abas deslizaveis no celular */
    .sub-tabs-wrap {
      display: flex; gap: 8px; margin: 16px 0 14px;
      overflow-x: auto; padding: 2px 2px 6px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .sub-tabs-wrap::-webkit-scrollbar { display: none; }
    .sub-tab {
      flex: 0 0 auto; white-space: nowrap;
      padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 700;
      cursor: pointer; border: 1px solid var(--borda);
      background: var(--bg-card); color: var(--texto);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .sub-tab.ativo {
      background: linear-gradient(135deg, #6d4aa3, #9333ea);
      color: #fff; border-color: #f5d37a;
      box-shadow: 0 0 18px rgba(168,85,247,0.45);
    }
    [data-tema="claro"] .sub-tab { background: #ffffff; color: #2b2319; border-color: rgba(184,134,11,0.4); }
    [data-tema="claro"] .sub-tab.ativo {
      background: linear-gradient(135deg, #c89b3c, #9a6d08);
      color: #fff; border-color: #8a6208;
      box-shadow: 0 6px 16px rgba(184,134,11,0.28);
    }

    .sub-panel { display: none; animation: subFadeUp 0.34s cubic-bezier(0.22, 1, 0.36, 1); }
    .sub-panel.ativo { display: block; }
    @keyframes subFadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .sub-anim-in { animation: subFadeUp 0.42s cubic-bezier(0.22, 1, 0.36, 1); }

    .sub-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .sub-info-box { padding: 18px; }
    .sub-kicker { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: var(--dourado-claro); margin-bottom: 8px; }
    [data-tema="claro"] .sub-kicker { color: #8a6208; }
    .sub-h2 { margin: 0 0 6px; font-size: 20px; }
    .sub-body { margin: 0; font-size: 14px; line-height: 1.58; overflow-wrap: anywhere; }
    .sub-muted { margin: 0; font-size: 13px; opacity: 0.8; }
    .sub-mono { font-family: 'JetBrains Mono', monospace; }
    .sub-eq { font-family: 'JetBrains Mono', monospace; font-size: 15px; padding: 10px 12px; border-radius: 10px; background: rgba(200,155,60,0.12); overflow-x: auto; }

    /* Escala de pH animada */
    .sub-ph-bar {
      position: relative; height: 16px; border-radius: 999px; margin: 10px 0 8px;
      background: linear-gradient(90deg, #ef4444 0%, #f97316 20%, #eab308 38%, #22c55e 50%, #06b6d4 66%, #3b82f6 82%, #8b5cf6 100%);
    }
    .sub-ph-marker {
      position: absolute; top: 50%; width: 22px; height: 22px; border-radius: 50%;
      background: #ffffff; border: 3px solid #140b24;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 14px rgba(255,255,255,0.9), 0 2px 8px rgba(0,0,0,0.45);
      transition: left 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .sub-ph-legend { display: flex; justify-content: space-between; font-size: 11px; opacity: 0.8; }

    /* Accordions */
    .sub-acc { padding: 16px 18px; }
    .sub-acc summary {
      font-weight: 800; font-size: 14px; cursor: pointer; list-style: none;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .sub-acc summary::after { content: '▾'; font-size: 14px; opacity: 0.7; transition: transform 0.2s; }
    .sub-acc[open] summary::after { transform: rotate(180deg); }
    .sub-acc p { margin-top: 10px; }
    .sub-warn { border-color: rgba(239,68,68,0.45) !important; }

    /* Molecula 3D + Massa */
    .sub-mol-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .sub-mol-ctrls { display: flex; flex-wrap: wrap; gap: 6px; }
    .sub-mol-ctrls .btn { padding: 6px 10px; font-size: 12px; border-radius: 9px; cursor: pointer; background: rgba(255,255,255,0.08); color: var(--texto); border: 1px solid var(--borda); }
    .sub-mol-stage {
      position: relative; width: 100%; height: 350px; border-radius: 14px; overflow: hidden;
      border: 1px solid var(--borda); background: #0e071d;
    }
    [data-tema="claro"] .sub-mol-stage { background: #faf3e3; }
    #sub-mol-viewport { width: 100%; height: 100%; position: relative; }
    .sub-mol-loading, .sub-mol-shield {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 16px; font-size: 13px; z-index: 6;
    }
    .sub-mol-shield { background: rgba(0,0,0,0.28); color: #fff; font-weight: 700; touch-action: pan-y; }
    .sub-mol-tip { margin-top: 10px; font-size: 12px; opacity: 0.8; }

    .sub-bar-row { margin-bottom: 10px; }
    .sub-bar-lbl { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px; gap: 8px; }
    .sub-atom-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; border: 1px solid rgba(0,0,0,0.3); vertical-align: middle; }
    .sub-bar-track { height: 9px; border-radius: 999px; background: rgba(148,163,184,0.2); overflow: hidden; }
    .sub-bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #6d4aa3, #c084fc, #f5d37a); }
    [data-tema="claro"] .sub-bar-fill { background: linear-gradient(90deg, #9a6d08, #c89b3c, #e7c873); }

    /* Local & Proximas */
    .sub-photo-wrap { width: 100%; max-height: 320px; border-radius: 14px; overflow: hidden; border: 1px solid var(--borda); margin-top: 8px; }
    .sub-photo-wrap img { width: 100%; height: 100%; max-height: 320px; object-fit: cover; display: block; }
    .sub-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .sub-chip-row .btn { text-decoration: none; padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; background: rgba(255,255,255,0.08); color: var(--texto); border: 1px solid var(--borda); }
    .sub-mini-link { display: inline-block; padding: 6px 11px; border-radius: 9px; font-size: 12px; font-weight: 700; text-decoration: none; border: 1px solid var(--borda); color: inherit; }
    .sub-meta-row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(200,162,77,0.22); font-size: 12px; opacity: 0.88; }
    .sub-near-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
    .sub-near-card {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px; border-radius: 13px; border: 1px solid var(--borda); background: rgba(255,255,255,0.04);
    }
    [data-tema="claro"] .sub-near-card { background: #faf3e3; }
    .sub-near-main { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: inherit; min-width: 0; }
    .sub-near-code { font-size: 10.5px; font-weight: 800; }
    .sub-near-main strong { font-size: 13.5px; overflow-wrap: anywhere; }
    .sub-near-main small { font-size: 11.5px; opacity: 0.82; }
    .sub-near-gps { flex-shrink: 0; padding: 6px 10px; border-radius: 9px; font-size: 11.5px; text-decoration: none; font-weight: 700; }

    /* Desafio & Equipe */
    .sub-q-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .sub-q-opt { text-align: left; padding: 11px 13px; border-radius: 11px; font-size: 13.5px; font-weight: 700; cursor: pointer; background: rgba(255,255,255,0.06); color: var(--texto); border: 1px solid var(--borda); }
    .sub-opt-ok { background: #15803d !important; color: #fff !important; border-color: #22c55e !important; }
    .sub-opt-err { background: #b91c1c !important; color: #fff !important; border-color: #ef4444 !important; }
    .sub-q-feedback { padding: 12px; border-radius: 12px; border: 1px solid var(--borda); font-size: 13px; line-height: 1.48; }
    .sub-quiz-end { text-align: center; padding: 14px 8px; }
    .sub-kv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .sub-kv-grid small { display: block; font-size: 11px; opacity: 0.75; margin-bottom: 2px; }
    .sub-kv-grid strong { font-size: 13.5px; overflow-wrap: anywhere; }

    /* Paginador anterior/proxima */
    .sub-pager { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
    .sub-pager-btn { display: flex; flex-direction: column; gap: 3px; padding: 13px 15px; text-decoration: none; color: inherit; }
    .sub-pager-btn small { font-size: 11px; opacity: 0.75; }
    .sub-pager-btn strong { font-size: 13px; overflow-wrap: anywhere; }
    .sub-pager-r { text-align: right; }

    /* Mobile fino */
    @media (max-width: 720px) {
      main#sub-pro-root { padding: 0 12px 146px; }
      .sub-hero { padding: 16px; }
      .sub-hero-main { flex-direction: column; align-items: stretch; gap: 12px; }
      .sub-formula-box { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; text-align: left; }
      .sub-formula-lbl { margin: 0; }
      .sub-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .sub-grid-2, .sub-q-opts, .sub-kv-grid, .sub-pager { grid-template-columns: 1fr; }
      .sub-pager-r { text-align: left; }
      .sub-mol-stage { height: 270px; }
    }
  </style>
  <link rel="stylesheet" href="/css/mobile-app.css?v=2">
</head>
<body>
  <main id="sub-pro-root">
    <div class="sub-card" style="padding:28px;text-align:center;">Carregando ficha da plaquinha...</div>
  </main>

  <script src="/js/substancia-pro.js?v=1" defer></script>
  <script src="/js/navbar-global.js?v=3" defer></script>
  <script src="/js/efeitos-editorial.js?v=7" defer></script>
  <script src="/js/progresso.js?v=5" defer></script>
  <script src="/js/scanner-qr.js?v=3" defer></script>
  <script src="/js/quimicobot-ia.js?v=4" defer></script>
  <script src="/js/mobile-app.js?v=2" defer></script>
</body>
</html>
